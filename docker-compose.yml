# Solo para desarrollo local. PostgreSQL con el esquema inicial cargado.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: surca
      POSTGRES_PASSWORD: surca_dev
      POSTGRES_DB: surca
    ports:
      - "5432:5432"
    volumes:
      - surca_datos:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  surca_datos:
